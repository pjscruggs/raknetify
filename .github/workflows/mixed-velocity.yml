name: Mixed-version Velocity smoke test

on:
  push:
    branches: [validation/mixed-velocity]

permissions:
  contents: read
  actions: read

jobs:
  mixed-velocity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: pjscruggs/raknetify
          ref: 76d2cafdcd2c01c6ed813ed66af8fd62aba63230
          path: source
          fetch-depth: 0
          submodules: true
          persist-credentials: false
      - uses: actions/setup-java@v4
        id: java21
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Install virtual display and software graphics
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth libgl1-mesa-dri libglx-mesa0 libegl1 libegl-mesa0 libvulkan1 mesa-vulkan-drivers libopenal1 libxrandr2 libxinerama1 libxcursor1 libxi6
      - name: Retrieve artifacts from the passing build
        id: artifacts
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          name: Artifacts
          path: source
          run-id: 40459589883
          github-token: ${{ github.token }}
      - name: Rebuild if the published artifacts expired
        if: steps.artifacts.outcome != 'success'
        working-directory: source
        run: ./gradlew clean build --no-daemon --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx2G'
      - name: Connect both clients through one Velocity instance
        env:
          JAVA21_HOME: ${{ steps.java21.outputs.path }}
          LIBGL_ALWAYS_SOFTWARE: '1'
          SDL_VIDEO_DRIVER: x11
          SDL_VIDEO_FORCE_EGL: '1'
        run: xvfb-run -a -s '-screen 0 1280x720x24' python3 smoke.py source
