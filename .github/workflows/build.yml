# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

jobs:
  build:
    strategy:
      matrix:
        # Use these Java versions
        java: [
          25,    # Required by Minecraft 26.x
        ]
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: setup jdk 17
        id: java17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 17
      - name: setup jdk 21
        id: java21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21
      - name: setup jdk ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: ${{ matrix.java }}
          java-package: jdk
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ./.gradle/loom-cache
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: build
        run: ./gradlew build :common:transportProbe
      - name: Linux server transports
        run: >-
          python3 .github/scripts/server-smoke.py --discard-runtime
          --jar fabric-universal/build/libs/*.jar
          --work-dir "$RUNNER_TEMP/raknetify-smoke"
          --java-17 "${{ steps.java17.outputs.path }}/bin/java"
          --java-21 "${{ steps.java21.outputs.path }}/bin/java"
      - name: Velocity and FastMOTD compatibility
        run: >-
          python3 .github/scripts/proxy-smoke.py
          --jar velocity/build/libs/*-all.jar
          --probe-dir common/build/transport-probe
          --work-dir "$RUNNER_TEMP/raknetify-smoke/fastmotd"
      - name: Disconnect reasons under packet loss
        run: >-
          python3 .github/scripts/disconnect-smoke.py --discard-runtime
          --jar fabric-universal/build/libs/*.jar
          --probe-dir common/build/transport-probe
          --work-dir "$RUNNER_TEMP/raknetify-smoke/disconnect"
          --java-17 "${{ steps.java17.outputs.path }}/bin/java"
          --java-21 "${{ steps.java21.outputs.path }}/bin/java"
      - name: Polymer shared-port compatibility
        run: >-
          python3 .github/scripts/server-smoke.py --discard-runtime
          --jar fabric-universal/build/libs/*.jar
          --work-dir "$RUNNER_TEMP/raknetify-smoke/polymer"
          --java-21 "${{ steps.java21.outputs.path }}/bin/java"
          --versions 1.21.11 26.3
          --polymer-lock .github/polymer-versions.json
      - name: Krypton version compatibility
        run: >-
          python3 .github/scripts/server-smoke.py --discard-runtime
          --jar fabric-universal/build/libs/*.jar
          --work-dir "$RUNNER_TEMP/raknetify-smoke/krypton"
          --java-17 "${{ steps.java17.outputs.path }}/bin/java"
          --java-21 "${{ steps.java21.outputs.path }}/bin/java"
          --krypton-lock .github/krypton-versions.json
          --encryption-legacy transport-test-legacy/build/libs/*.jar
          --encryption-modern transport-test-modern/build/libs/*.jar
      - name: Polymer and Krypton together
        run: >-
          python3 .github/scripts/server-smoke.py --discard-runtime
          --jar fabric-universal/build/libs/*.jar
          --work-dir "$RUNNER_TEMP/raknetify-smoke/polymer-krypton"
          --java-21 "${{ steps.java21.outputs.path }}/bin/java"
          --versions 1.21.11 26.3
          --polymer-lock .github/polymer-versions.json
          --krypton-lock .github/krypton-versions.json
          --encryption-legacy transport-test-legacy/build/libs/*.jar
          --encryption-modern transport-test-modern/build/libs/*.jar
      - name: PacketFixer version compatibility
        run: >-
          python3 .github/scripts/server-smoke.py --discard-runtime
          --jar fabric-universal/build/libs/*.jar
          --work-dir "$RUNNER_TEMP/raknetify-smoke/packetfixer"
          --java-17 "${{ steps.java17.outputs.path }}/bin/java"
          --java-21 "${{ steps.java21.outputs.path }}/bin/java"
          --packetfixer-lock .github/packetfixer-versions.json
          --encryption-legacy transport-test-legacy/build/libs/*.jar
          --encryption-modern transport-test-modern/build/libs/*.jar
      - name: PacketFixer and Krypton together
        run: >-
          python3 .github/scripts/server-smoke.py --discard-runtime
          --jar fabric-universal/build/libs/*.jar
          --work-dir "$RUNNER_TEMP/raknetify-smoke/packetfixer-krypton"
          --java-17 "${{ steps.java17.outputs.path }}/bin/java"
          --java-21 "${{ steps.java21.outputs.path }}/bin/java"
          --versions 1.18 1.20.5 1.21.11 26.1 26.2 26.3
          --packetfixer-lock .github/packetfixer-versions.json
          --krypton-lock .github/krypton-versions.json
          --encryption-legacy transport-test-legacy/build/libs/*.jar
          --encryption-modern transport-test-modern/build/libs/*.jar
      - name: PacketFixer with Polymer and Krypton
        run: >-
          python3 .github/scripts/server-smoke.py --discard-runtime
          --jar fabric-universal/build/libs/*.jar
          --work-dir "$RUNNER_TEMP/raknetify-smoke/packetfixer-polymer-krypton"
          --java-21 "${{ steps.java21.outputs.path }}/bin/java"
          --versions 1.21.11 26.3
          --packetfixer-lock .github/packetfixer-versions.json
          --polymer-lock .github/polymer-versions.json
          --krypton-lock .github/krypton-versions.json
          --encryption-legacy transport-test-legacy/build/libs/*.jar
          --encryption-modern transport-test-modern/build/libs/*.jar
      - name: Native gameplay and signed chat ordering
        run: >-
          python3 .github/scripts/client-address-check.py --ordering-only
          --jar fabric-universal/build/libs/*.jar
          --fixture transport-test-client/build/libs/*.jar
          --work-dir "$RUNNER_TEMP/raknetify-smoke/ordering"
          --java-17 "${{ steps.java17.outputs.path }}/bin/java"
          --java-21 "${{ steps.java21.outputs.path }}/bin/java"
      - name: Native transfer negotiation
        run: >-
          python3 .github/scripts/transfer-smoke.py --discard-runtime
          --jar fabric-universal/build/libs/*.jar
          --encryption-legacy transport-test-legacy/build/libs/*.jar
          --encryption-modern transport-test-modern/build/libs/*.jar
          --work-dir "$RUNNER_TEMP/raknetify-smoke/transfers"
          --java-21 "${{ steps.java21.outputs.path }}/bin/java"
          --companion-lock .github/polymer-versions.json
      - name: Transfer clients with Fabric API and Polymer
        run: >-
          python3 .github/scripts/client-address-check.py --ordering-only
          --jar fabric-universal/build/libs/*.jar
          --fixture transport-test-client/build/libs/*.jar
          --lock .github/polymer-versions.json
          --work-dir "$RUNNER_TEMP/raknetify-smoke/transfer-clients"
          --java-21 "${{ steps.java21.outputs.path }}/bin/java"
      - name: Fast IP Ping client addresses
        run: >-
          python3 .github/scripts/client-address-check.py
          --jar fabric-universal/build/libs/*.jar
          --fixture transport-test-client/build/libs/*.jar
          --lock .github/fastipping-versions.json
          --work-dir "$RUNNER_TEMP/raknetify-smoke/fastipping"
          --java-17 "${{ steps.java17.outputs.path }}/bin/java"
          --java-21 "${{ steps.java21.outputs.path }}/bin/java"
      - name: capture network smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Linux-network-smoke-logs
          path: ${{ runner.temp }}/raknetify-smoke/**/*.log
      - name: prepare downloads
        run: |
          mkdir -p "$RUNNER_TEMP/raknetify-downloads"
          cp fabric-universal/build/libs/*.jar "$RUNNER_TEMP/raknetify-downloads/"
          cp fabric-universal/build/generated/metadata/compatibility.json "$RUNNER_TEMP/raknetify-downloads/"
          cp velocity/build/libs/*-all.jar bungee/build/libs/*-all.jar "$RUNNER_TEMP/raknetify-downloads/"
      - name: capture build artifacts
        if: ${{ runner.os == 'Linux' && matrix.java == '25' }} # Only upload artifacts built from latest java on one OS
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: ${{ runner.temp }}/raknetify-downloads/*
