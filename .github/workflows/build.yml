name: build
on:
  pull_request:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Documentation and complexity
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: gradle/actions/wrapper-validation@v6.4.1
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 25
      - name: Check every owned source before compiling Minecraft modules
        run: ./gradlew -p quality check --no-daemon --max-workers=2
      - name: Preserve quality reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Quality-reports
          path: quality/build/reports/
          if-no-files-found: warn

  mappings:
    name: Regenerate packet mappings
    needs: quality
    uses: ./.github/workflows/checkMappings.yml

  build:
    name: Build and unit tests
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          submodules: true
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 25
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ./.gradle/loom-cache
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Build and run unit tests
        run: ./gradlew build :common:transportProbe --warning-mode fail --no-daemon --max-workers=2
      - name: Preserve unit and quality reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Build-test-reports
          path: |
            **/build/test-results/**/*.xml
            **/build/reports/**
          if-no-files-found: warn
      - name: Stage the exact artifacts for downstream verification
        run: |
          mkdir -p ci-input
          cp --parents fabric-universal/build/libs/*.jar fabric-universal/build/generated/metadata/compatibility.json ci-input/
          cp --parents velocity/build/libs/*-all.jar bungee/build/libs/*-all.jar ci-input/
          cp --parents transport-test-legacy/build/libs/*.jar transport-test-modern/build/libs/*.jar transport-test-client/build/libs/*.jar ci-input/
          cp --parents forge/build/libs/*.jar neoforge/build/libs/*.jar ci-input/
          cp --parents spigot/build/libs/*.jar ci-input/
          cp --parents -r common/build/transport-probe ci-input/
          cd ci-input
          find . -type f -print0 | sort -z | xargs -0 sha256sum > ../test-inputs.sha256
          mv ../test-inputs.sha256 .
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: Test-inputs
          path: ci-input/
          if-no-files-found: error
          retention-days: 7

  network:
    name: ${{ matrix.suite }} (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        os: [ubuntu-24.04]
        suite: [server, proxy, disconnect, polymer, krypton, polymer-krypton, packetfixer, packetfixer-krypton, packetfixer-polymer-krypton, ordering, transfers, transfer-clients, fastipping]
        include:
          - os: windows-2022
            suite: disconnect
          - os: windows-2022
            suite: ordering
          - os: windows-2022
            suite: proxy
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: Test-inputs
      - name: Verify exact build inputs
        run: sha256sum --check test-inputs.sha256
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        id: java17
        with:
          distribution: zulu
          java-version: 17
      - uses: actions/setup-java@v5
        id: java21
        with:
          distribution: zulu
          java-version: 21
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 25
      - name: Linux server transports
        if: matrix.suite == 'server'
        run: >-
          python .github/scripts/server-smoke.py --discard-runtime
          --jar fabric-universal/build/libs/*.jar
          --work-dir "$RUNNER_TEMP/raknetify-smoke"
          --java-17 "${{ steps.java17.outputs.path }}/bin/java"
          --java-21 "${{ steps.java21.outputs.path }}/bin/java"
      - name: Velocity and FastMOTD compatibility
        if: matrix.suite == 'proxy'
        run: >-
          python .github/scripts/proxy-smoke.py
          --jar velocity/build/libs/*-all.jar
          --probe-dir common/build/transport-probe
          --work-dir "$RUNNER_TEMP/raknetify-smoke/fastmotd"
      - name: Disconnect reasons under packet loss
        if: matrix.suite == 'disconnect'
        run: >-
          python .github/scripts/disconnect-smoke.py --discard-runtime
          --jar fabric-universal/build/libs/*.jar
          --probe-dir common/build/transport-probe
          --work-dir "$RUNNER_TEMP/raknetify-smoke/disconnect"
          --java-17 "${{ steps.java17.outputs.path }}/bin/java"
          --java-21 "${{ steps.java21.outputs.path }}/bin/java"
      - name: Polymer shared-port compatibility
        if: matrix.suite == 'polymer'
        run: >-
          python .github/scripts/server-smoke.py --discard-runtime
          --jar fabric-universal/build/libs/*.jar
          --work-dir "$RUNNER_TEMP/raknetify-smoke/polymer"
          --java-21 "${{ steps.java21.outputs.path }}/bin/java"
          --versions 1.21.11 26.3
          --polymer-lock .github/polymer-versions.json
      - name: Krypton version compatibility
        if: matrix.suite == 'krypton'
        run: >-
          python .github/scripts/server-smoke.py --discard-runtime
          --jar fabric-universal/build/libs/*.jar
          --work-dir "$RUNNER_TEMP/raknetify-smoke/krypton"
          --java-17 "${{ steps.java17.outputs.path }}/bin/java"
          --java-21 "${{ steps.java21.outputs.path }}/bin/java"
          --krypton-lock .github/krypton-versions.json
          --encryption-legacy transport-test-legacy/build/libs/*.jar
          --encryption-modern transport-test-modern/build/libs/*.jar
      - name: Polymer and Krypton together
        if: matrix.suite == 'polymer-krypton'
        run: >-
          python .github/scripts/server-smoke.py --discard-runtime
          --jar fabric-universal/build/libs/*.jar
          --work-dir "$RUNNER_TEMP/raknetify-smoke/polymer-krypton"
          --java-21 "${{ steps.java21.outputs.path }}/bin/java"
          --versions 1.21.11 26.3
          --polymer-lock .github/polymer-versions.json
          --krypton-lock .github/krypton-versions.json
          --encryption-legacy transport-test-legacy/build/libs/*.jar
          --encryption-modern transport-test-modern/build/libs/*.jar
      - name: PacketFixer version compatibility
        if: matrix.suite == 'packetfixer'
        run: >-
          python .github/scripts/server-smoke.py --discard-runtime
          --jar fabric-universal/build/libs/*.jar
          --work-dir "$RUNNER_TEMP/raknetify-smoke/packetfixer"
          --java-17 "${{ steps.java17.outputs.path }}/bin/java"
          --java-21 "${{ steps.java21.outputs.path }}/bin/java"
          --packetfixer-lock .github/packetfixer-versions.json
          --encryption-legacy transport-test-legacy/build/libs/*.jar
          --encryption-modern transport-test-modern/build/libs/*.jar
      - name: PacketFixer and Krypton together
        if: matrix.suite == 'packetfixer-krypton'
        run: >-
          python .github/scripts/server-smoke.py --discard-runtime
          --jar fabric-universal/build/libs/*.jar
          --work-dir "$RUNNER_TEMP/raknetify-smoke/packetfixer-krypton"
          --java-17 "${{ steps.java17.outputs.path }}/bin/java"
          --java-21 "${{ steps.java21.outputs.path }}/bin/java"
          --versions 1.18 1.20.5 1.21.11 26.1 26.2 26.3
          --packetfixer-lock .github/packetfixer-versions.json
          --krypton-lock .github/krypton-versions.json
          --encryption-legacy transport-test-legacy/build/libs/*.jar
          --encryption-modern transport-test-modern/build/libs/*.jar
      - name: PacketFixer with Polymer and Krypton
        if: matrix.suite == 'packetfixer-polymer-krypton'
        run: >-
          python .github/scripts/server-smoke.py --discard-runtime
          --jar fabric-universal/build/libs/*.jar
          --work-dir "$RUNNER_TEMP/raknetify-smoke/packetfixer-polymer-krypton"
          --java-21 "${{ steps.java21.outputs.path }}/bin/java"
          --versions 1.21.11 26.3
          --packetfixer-lock .github/packetfixer-versions.json
          --polymer-lock .github/polymer-versions.json
          --krypton-lock .github/krypton-versions.json
          --encryption-legacy transport-test-legacy/build/libs/*.jar
          --encryption-modern transport-test-modern/build/libs/*.jar
      - name: Native gameplay and signed chat ordering
        if: matrix.suite == 'ordering'
        run: >-
          python .github/scripts/client-address-check.py --ordering-only
          --jar fabric-universal/build/libs/*.jar
          --fixture transport-test-client/build/libs/*.jar
          --work-dir "$RUNNER_TEMP/raknetify-smoke/ordering"
          --java-17 "${{ steps.java17.outputs.path }}/bin/java"
          --java-21 "${{ steps.java21.outputs.path }}/bin/java"
      - name: Native transfer negotiation
        if: matrix.suite == 'transfers'
        run: >-
          python .github/scripts/transfer-smoke.py --discard-runtime
          --jar fabric-universal/build/libs/*.jar
          --encryption-legacy transport-test-legacy/build/libs/*.jar
          --encryption-modern transport-test-modern/build/libs/*.jar
          --work-dir "$RUNNER_TEMP/raknetify-smoke/transfers"
          --java-21 "${{ steps.java21.outputs.path }}/bin/java"
          --companion-lock .github/polymer-versions.json
      - name: Transfer clients with Fabric API and Polymer
        if: matrix.suite == 'transfer-clients'
        run: >-
          python .github/scripts/client-address-check.py --ordering-only
          --jar fabric-universal/build/libs/*.jar
          --fixture transport-test-client/build/libs/*.jar
          --lock .github/polymer-versions.json
          --work-dir "$RUNNER_TEMP/raknetify-smoke/transfer-clients"
          --java-21 "${{ steps.java21.outputs.path }}/bin/java"
      - name: Fast IP Ping client addresses
        if: matrix.suite == 'fastipping'
        run: >-
          python .github/scripts/client-address-check.py
          --jar fabric-universal/build/libs/*.jar
          --fixture transport-test-client/build/libs/*.jar
          --lock .github/fastipping-versions.json
          --work-dir "$RUNNER_TEMP/raknetify-smoke/fastipping"
          --java-17 "${{ steps.java17.outputs.path }}/bin/java"
          --java-21 "${{ steps.java21.outputs.path }}/bin/java"
      - name: Preserve native test logs
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Network-${{ matrix.os }}-${{ matrix.suite }}
          path: ${{ runner.temp }}/raknetify-smoke/**/*.log
          if-no-files-found: warn

  native-loaders:
    name: ${{ matrix.loader }} packaged runtime (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-24.04, windows-2022]
        loader: [forge, neoforge]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: Test-inputs
      - name: Verify exact build inputs
        run: sha256sum --check test-inputs.sha256
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 25
      - name: Install Linux client display dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libegl1 libegl-mesa0 mesa-vulkan-drivers libasound2t64 libxkbcommon0
      - name: Test packaged native loaders
        env:
          LOADER: ${{ matrix.loader }}
          LIBGL_ALWAYS_SOFTWARE: 'true'
        run: |
          jar=$(find "$LOADER/build/libs" -name '*.jar' ! -name '*-dev.jar' ! -name '*-transport-test.jar')
          fixture=$(find "$LOADER/build/libs" -name '*-transport-test.jar')
          command=(python .github/scripts/native-loader-smoke.py --loader "$LOADER" --jar "$jar" --fixture "$fixture" --fabric-jar fabric-universal/build/libs/*.jar --probe-dir common/build/transport-probe --work-dir "$RUNNER_TEMP/native-$LOADER")
          if [ "$RUNNER_OS" = Linux ]; then
            # EGL supplies the sRGB framebuffer Minecraft requires on the software-rendered X display.
            SDL_VIDEO_FORCE_EGL=1 xvfb-run -a -s '-screen 0 1280x720x24' "${command[@]}"
          else
            "${command[@]}" --side server
          fi
      - name: Preserve native runtime evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Native-${{ matrix.loader }}-${{ matrix.os }}-logs
          path: ${{ runner.temp }}/native-${{ matrix.loader }}/*.log
          if-no-files-found: error

  spigot:
    name: ${{ matrix.platform }} packaged plugin (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-24.04, windows-2022]
        platform: [spigot, paper]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: Test-inputs
      - name: Verify exact build inputs
        run: sha256sum --check test-inputs.sha256
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 25
      - name: Install Linux client display dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libegl1 libegl-mesa0 mesa-vulkan-drivers libasound2t64 libxkbcommon0
      - name: Test native plugin authentication and gameplay
        env:
          PLATFORM: ${{ matrix.platform }}
          LIBGL_ALWAYS_SOFTWARE: 'true'
        run: |
          jar=$(find spigot/build/libs -name '*.jar' ! -name '*-dev.jar')
          client=$(find neoforge/build/libs -name '*.jar' ! -name '*-dev.jar' ! -name '*-transport-test.jar')
          fixture=$(find neoforge/build/libs -name '*-transport-test.jar')
          command=(python .github/scripts/spigot-smoke.py --platform "$PLATFORM" --jar "$jar" --client-jar "$client" --client-fixture "$fixture" --probe-dir common/build/transport-probe --work-dir "$RUNNER_TEMP/plugin-$PLATFORM")
          if [ "$RUNNER_OS" = Linux ]; then
            SDL_VIDEO_FORCE_EGL=1 xvfb-run -a -s '-screen 0 1280x720x24' "${command[@]}"
          else
            "${command[@]}" --side server
          fi
      - name: Preserve plugin runtime evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Plugin-${{ matrix.platform }}-${{ matrix.os }}-logs
          path: ${{ runner.temp }}/plugin-${{ matrix.platform }}/**/*.log
          if-no-files-found: error

  downloads:
    name: Verified downloads
    needs: [quality, mappings, build, network, native-loaders, spigot]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: Test-inputs
      - name: Verify and prepare release files
        run: |
          sha256sum --check test-inputs.sha256
          mkdir -p downloads
          cp fabric-universal/build/libs/*.jar fabric-universal/build/generated/metadata/compatibility.json downloads/
          cp velocity/build/libs/*-all.jar bungee/build/libs/*-all.jar downloads/
          find forge/build/libs neoforge/build/libs -name '*.jar' ! -name '*-dev.jar' ! -name '*-transport-test.jar' -exec cp {} downloads/ \;
          find spigot/build/libs -name '*.jar' ! -name '*-dev.jar' -exec cp {} downloads/ \;
          cd downloads
          sha256sum ./*.jar ./compatibility.json > SHA256SUMS
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: Artifacts
          path: downloads/*
          if-no-files-found: error
