name: check mappings
on: [workflow_call]

permissions:
  contents: read

jobs:
  checkMappings:
    timeout-minutes: 120
    strategy:
      matrix:
        # Use these Java versions
        java: [
          25,    # Required by Minecraft 26.x
        ]
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: setup jdk ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: ${{ matrix.java }}
          java-package: jdk
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ./.gradle/loom-cache
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: "cache mappingsGen"
        uses: actions/cache@v4
        with:
          path: |
            ./run-mappingsGen
          key: ${{ runner.os }}-mappingsGen-${{ hashFiles('./genMappings.sh', './.github/scripts/generate-mappings.py', './supported-versions.json') }}
          restore-keys: |
            ${{ runner.os }}-mappingsGen-
      - name: generate mappings
        env:
          MAPPINGS_GEN_FRESH: true
        run: ./genMappings.sh
      - name: fail if mappings changed
        run: |
          if ! git diff --exit-code --; then
              echo "Mappings changed, please commit them"
              git diff
              git diff --staged
              exit 1
          fi
