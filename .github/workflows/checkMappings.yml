name: check mappings
on: [pull_request, push]

permissions:
  contents: read

jobs:
  checkMappings:
    strategy:
      matrix:
        # Use these Java versions
        java: [
          21,    # Current Java LTS & minimum supported by Minecraft
        ]
        # and run on both Linux and Windows
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: true
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: setup jdk ${{ matrix.java }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'zulu'
          java-version: ${{ matrix.java }}
          java-package: jdk
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ./.gradle/loom-cache
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: "cache mappingsGen"
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ./run-mappingsGen
          key: ${{ runner.os }}-mappingsGen-${{ hashFiles('./genMappings.sh') }}
          restore-keys: |
            ${{ runner.os }}-mappingsGen-
      - name: generate mappings
        env:
          MAPPINGS_GEN_FRESH: true
        run: ./genMappings.sh
      - name: fail if mappings changed
        run: |
          git update-index --refresh
          if ! git diff-index --quiet HEAD --; then
              echo "Mappings changed, please commit them"
              git diff
              git diff --staged
              exit 1
          fi
