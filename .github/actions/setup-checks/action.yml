name: Set up source checks
description: Install pinned Python and workflow analyzers for the Linux build jobs.
runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.13'
    - name: Install pinned Python checks
      shell: bash
      run: >-
        python -m pip install --require-hashes --only-binary=:all: -r quality/requirements.txt
    - name: Install verified workflow analyzers
      shell: bash
      run: |
        tools="$RUNNER_TEMP/workflow-tools"
        mkdir -p "$tools"
        curl --fail --location --retry 3 -o "$tools/actionlint.tar.gz" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
        echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $tools/actionlint.tar.gz" | sha256sum --check --strict
        tar -xzf "$tools/actionlint.tar.gz" -C "$tools" actionlint
        curl --fail --location --retry 3 -o "$tools/shellcheck.tar.gz" https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.gz
        echo "b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6  $tools/shellcheck.tar.gz" | sha256sum --check --strict
        tar -xzf "$tools/shellcheck.tar.gz" -C "$tools" --strip-components=1 shellcheck-v0.11.0/shellcheck
        echo "$tools" >> "$GITHUB_PATH"
