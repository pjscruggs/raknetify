/** Builds an isolated encryption-test mod that is excluded from the release downloads. */
apply plugin: 'net.fabricmc.fabric-loom'

dependencies {
    minecraft "com.mojang:minecraft:${project.modern_minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation project(':common')
}

sourceSets.main.java.srcDir rootProject.file('transport-tests/shared')
java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

// Test fixtures are built for CI only and have no Maven publication.
publishing { publications.clear() }
