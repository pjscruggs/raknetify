/** Builds the unobfuscated modern Fabric runtime embedded in the universal distribution. */
apply plugin: 'net.fabricmc.fabric-loom'
apply plugin: 'com.gradleup.shadow'

base {
    archivesName = project.archives_base_name + '-fabric-26'
}

group = project.maven_group + ".fabric"

configurations {
    shadowInclude
}

dependencies {
    minecraft "com.mojang:minecraft:${project.modern_minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    shadowInclude implementation(project(':common'))
}

def supported = rootProject.supportedVersions.modern

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft', groovy.json.JsonOutput.toJson(supported.minecraft)
    inputs.property 'java', supported.java
    inputs.property 'loader', supported.fabricloader
    filesMatching('fabric.mod.json') {
        // Replace the quoted placeholder with a JSON string or array before expanding the other values.
        filter { line -> line.replace('"${minecraft}"', inputs.properties.minecraft) }
        expand version: project.version,
                loader: inputs.properties.loader, java: inputs.properties.java
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

loom {
    accessWidenerPath = file('src/main/resources/raknetify-fabric.accesswidener')
}

shadowJar {
    dependencies {
        exclude(dependency('it.unimi.dsi:fastutil'))
    }
    exclude 'META-INF/LICENSE.txt', 'META-INF/NOTICE.txt'
    minimize()
    archiveClassifier = 'all'
    configurations = [project.configurations.shadowInclude]
    from '../LICENSE'
}

assemble.dependsOn(shadowJar)

jar {
    from "../LICENSE"
}
