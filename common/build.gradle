/** Builds platform-independent framing, compression, synchronization, and diagnostic code. */
dependencies {
    compileOnlyApi 'de.maxhenkel.voicechat:voicechat-api:2.2.39'
    testImplementation 'de.maxhenkel.voicechat:voicechat-api:2.2.39'
    api("com.github.RelativityMC.netty-raknet:netty-raknet-common") {
        transitive = false
    }
    api("com.github.RelativityMC.netty-raknet:netty-raknet-client")
    api("com.github.RelativityMC.netty-raknet:netty-raknet-server")
    api("org.apache.commons:commons-math3:3.6.1")

    //noinspection GradlePackageUpdate
    compileOnly("io.netty:netty-all:4.1.25.Final")

    compileOnly("com.google.code.gson:gson:2.9.0")
    compileOnly("com.google.guava:guava:31.1-jre")

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.3'
    testImplementation 'com.tngtech.archunit:archunit:1.5.1'
    testImplementation 'io.netty:netty-all:4.1.25.Final'
    testImplementation 'com.google.guava:guava:31.1-jre'
    testRuntimeOnly 'com.google.code.gson:gson:2.9.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test { useJUnitPlatform() }

tasks.register('transportProbe', Sync) {
    dependsOn testClasses
    into layout.buildDirectory.dir('transport-probe')
    from(sourceSets.test.output) { into 'classes' }
    from(sourceSets.main.output) { into 'classes' }
    from(configurations.testRuntimeClasspath.filter { it.name.endsWith('.jar') }) { into 'lib' }
}

// Share bounded payload witnesses with the isolated native test mods.
sourceSets.test.java.srcDir rootProject.file('transport-tests/shared')

sourceSets {
    benchmark {
        compileClasspath += sourceSets.main.output + configurations.testRuntimeClasspath
        runtimeClasspath += sourceSets.main.output + configurations.testRuntimeClasspath
    }
}

dependencies {
    benchmarkImplementation 'org.openjdk.jmh:jmh-core:1.37'
    benchmarkAnnotationProcessor 'org.openjdk.jmh:jmh-generator-annprocess:1.37'
}

tasks.register('benchmark', JavaExec) {
    group = 'verification'
    description = 'Measure transport operations with independent JVM forks and allocation profiling.'
    dependsOn benchmarkClasses
    classpath = sourceSets.benchmark.runtimeClasspath
    mainClass = 'org.openjdk.jmh.Main'
    doFirst { layout.buildDirectory.dir('reports').get().asFile.mkdirs() }
    args '-foe', 'true', '-f', '3', '-wi', '3', '-i', '5', '-w', '1s', '-r', '1s', '-prof', 'gc',
            '-jvmArgsAppend', '-Xms256m -Xmx256m', '-rf', 'json',
            '-rff', layout.buildDirectory.file('reports/benchmark.json').get().asFile.absolutePath
}

// The JMH generator owns its harness sources. Handwritten benchmark sources remain fully checked.
tasks.named('compileBenchmarkJava', JavaCompile) {
    options.errorprone.excludedPaths = '.*/generated/sources/annotationProcessor/java/benchmark/.*'
}
