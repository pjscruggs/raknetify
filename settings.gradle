/** Defines the mod modules and includes the transport dependency and source-quality build. */
pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

rootProject.name = "raknetify2"

includeBuild('quality')

includeBuild('netty-raknet') {
    dependencySubstitution {
        substitute module("com.github.RelativityMC.netty-raknet:netty-raknet-common") using project(":netty-raknet-common")
        substitute module("com.github.RelativityMC.netty-raknet:netty-raknet-client") using project(":netty-raknet-client")
        substitute module("com.github.RelativityMC.netty-raknet:netty-raknet-server") using project(":netty-raknet-server")
    }
}

include "fabric"
include "fabric-26"
include "fabric-universal"
include "neoforge"
include "forge"
include "velocity"
include "bungee"
include "common"

include "transport-test-legacy"
include "transport-test-modern"

include "transport-test-client"
